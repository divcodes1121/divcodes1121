<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>
    <style>
      .mono { font-family: Consolas, 'SF Mono', Menlo, monospace; }
      .sans { font-family: 'Segoe UI', system-ui, sans-serif; }
      .line { stroke-dasharray: 250; stroke-dashoffset: 250; animation: draw 16s cubic-bezier(.4,0,.2,1) infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 250; } 18% { stroke-dashoffset: 0; } 90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 250; } }
      .node { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: pop 16s cubic-bezier(.3,1.4,.4,1) infinite; }
      .item { opacity: 0; animation: fade 16s ease infinite; }
      .n1 { animation-delay: .3s; }  .i1 { animation-delay: .45s; }
      .n2 { animation-delay: .9s; }  .i2 { animation-delay: 1.05s; }
      .n3 { animation-delay: 1.5s; } .i3 { animation-delay: 1.65s; }
      .n4 { animation-delay: 2.1s; } .i4 { animation-delay: 2.25s; }
      .n5 { animation-delay: 2.7s; } .i5 { animation-delay: 2.85s; }
      @keyframes pop { 0% { transform: scale(0); } 2.5% { transform: scale(1); } 92% { transform: scale(1); } 97%,100% { transform: scale(0); } }
      @keyframes fade { 0% { opacity: 0; transform: translateX(-6px); } 2.5% { opacity: 1; transform: none; } 92% { opacity: 1; } 97%,100% { opacity: 0; } }
    </style>
  </defs>

  <rect width="880" height="330" fill="#0D1117" rx="14" stroke="#21262D" stroke-width="1.5"/>

  <line class="line" x1="150" y1="42" x2="150" y2="292" stroke="url(#accentV)" stroke-width="2"/>

  <!-- 2023 -->
  <circle class="node n1" cx="150" cy="56" r="6" fill="#0D1117" stroke="#8A2BE2" stroke-width="2"/>
  <g class="item i1">
    <text x="122" y="61" text-anchor="end" class="mono" font-size="12" fill="#7D8590">2023</text>
    <text x="176" y="53" class="sans" font-size="14" font-weight="600" fill="#E6EDF3">initialized</text>
    <text x="176" y="71" class="sans" font-size="12.5" fill="#7D8590">enrolled cse (ai &amp; ml) @ vit-ap university · first commit pushed</text>
  </g>

  <!-- 2024 -->
  <circle class="node n2" cx="150" cy="115" r="6" fill="#0D1117" stroke="#8A2BE2" stroke-width="2"/>
  <g class="item i2">
    <text x="122" y="120" text-anchor="end" class="mono" font-size="12" fill="#7D8590">2024</text>
    <text x="176" y="112" class="sans" font-size="14" font-weight="600" fill="#E6EDF3">backend era</text>
    <text x="176" y="130" class="sans" font-size="12.5" fill="#7D8590">metro ticket booking system — spring boot, mysql, real-time seat state</text>
  </g>

  <!-- 2025 -->
  <circle class="node n3" cx="150" cy="174" r="6" fill="#0D1117" stroke="#00A8D9" stroke-width="2"/>
  <g class="item i3">
    <text x="122" y="179" text-anchor="end" class="mono" font-size="12" fill="#7D8590">2025</text>
    <text x="176" y="171" class="sans" font-size="14" font-weight="600" fill="#E6EDF3">full-stack + ml</text>
    <text x="176" y="189" class="sans" font-size="12.5" fill="#7D8590">mern rental platform · price prediction models · eth deposit tracker</text>
  </g>

  <!-- 2026 -->
  <circle class="node n4" cx="150" cy="233" r="6" fill="#0D1117" stroke="#00D9FF" stroke-width="2"/>
  <g class="item i4">
    <text x="122" y="238" text-anchor="end" class="mono" font-size="12" fill="#7D8590">2026</text>
    <text x="176" y="230" class="sans" font-size="14" font-weight="600" fill="#E6EDF3">ai systems</text>
    <text x="176" y="248" class="sans" font-size="12.5" fill="#7D8590">llm-powered ticket triage · automated video pipeline · daily dsa reps</text>
  </g>

  <!-- NEXT -->
  <circle class="node n5" cx="150" cy="292" r="6" fill="#00D9FF"/>
  <g class="item i5">
    <text x="122" y="297" text-anchor="end" class="mono" font-size="12" fill="#00D9FF">next</text>
    <text x="176" y="289" class="sans" font-size="14" font-weight="600" fill="#E6EDF3">distributed systems at scale</text>
    <text x="176" y="307" class="sans" font-size="12.5" fill="#7D8590">the problems worth being wrong about</text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 380" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>
    <style>
      .mono { font-family: Consolas, 'SF Mono', Menlo, monospace; }
      .tw { animation: tw 3s ease-in-out infinite; }
      .tw2 { animation-delay: .8s; } .tw3 { animation-delay: 1.6s; } .tw4 { animation-delay: 2.2s; }
      @keyframes tw { 0%,100% { opacity: .25; } 50% { opacity: .9; } }
      .cloud1 { animation: drift 46s linear infinite alternate; }
      .cloud2 { animation: drift 34s linear infinite alternate-reverse; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(70px); } }
      .isle { animation: float 7s ease-in-out infinite alternate; }
      @keyframes float { from { transform: translateY(0); } to { transform: translateY(6px); } }
      .shadow { transform-box: fill-box; transform-origin: center; animation: shadow 7s ease-in-out infinite alternate; }
      @keyframes shadow { from { transform: scaleX(1); opacity:.35; } to { transform: scaleX(.82); opacity:.22; } }
      .walker { animation: walk 30s linear infinite; }
      @keyframes walk {
        0%, 13%     { transform: translateX(0); }
        16.6%, 29.6% { transform: translateX(160px); }
        33.3%, 46.3% { transform: translateX(330px); }
        50%, 63%    { transform: translateX(490px); }
        66.6%, 79.6% { transform: translateX(650px); }
        100%        { transform: translateX(0); }
      }
      .bob { animation: bob .55s steps(2) infinite; }
      @keyframes bob { 50% { transform: translateY(-1px); } }
      .g1 { animation: g1 30s linear infinite; } @keyframes g1 { 0%,14% { opacity: 1; } 17%,100% { opacity: .28; } }
      .g2 { animation: g2 30s linear infinite; } @keyframes g2 { 0%,15% { opacity: .28; } 17%,31% { opacity: 1; } 34%,100% { opacity: .28; } }
      .g3 { animation: g3 30s linear infinite; } @keyframes g3 { 0%,32% { opacity: .28; } 34%,47% { opacity: 1; } 50%,100% { opacity: .28; } }
      .g4 { animation: g4 30s linear infinite; } @keyframes g4 { 0%,48% { opacity: .28; } 50%,64% { opacity: 1; } 67%,100% { opacity: .28; } }
      .g5 { animation: g5 30s linear infinite; } @keyframes g5 { 0%,65% { opacity: .28; } 67%,80% { opacity: 1; } 83%,100% { opacity: .28; } }
      .fly1 { animation: fly1 9s ease-in-out infinite alternate; }
      .fly2 { animation: fly2 12s ease-in-out infinite alternate; }
      .fly3 { animation: fly3 10s ease-in-out infinite alternate; }
      @keyframes fly1 { from { transform: translate(0,0); } to { transform: translate(30px,-14px); } }
      @keyframes fly2 { from { transform: translate(0,0); } to { transform: translate(-26px,-10px); } }
      @keyframes fly3 { from { transform: translate(0,0); } to { transform: translate(18px,-18px); } }
      .flame { animation: flame .4s steps(2) infinite; }
      @keyframes flame { 50% { opacity: .4; } }
    </style>
  </defs>


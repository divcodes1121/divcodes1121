<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity=".35"/>
    </linearGradient>
    <style>
      .mono { font-family: Consolas, 'SF Mono', Menlo, monospace; }
      .sweep { transform-box: view-box; transform-origin: 230px 210px; animation: sweep 6s linear infinite; }
      @keyframes sweep { to { transform: rotate(360deg); } }
      .blip { animation: blip 6s ease-out infinite; }
      .ping { transform-box: fill-box; transform-origin: center; animation: ping 6s ease-out infinite; }
      @keyframes blip { 0%,4% { opacity: .25; } 6%,60% { opacity: 1; } 100% { opacity: .25; } }
      @keyframes ping { 0%,5% { transform: scale(1); opacity: .7; } 30% { transform: scale(3.4); opacity: 0; } 100% { opacity: 0; } }
      .k1 { animation-delay: .4s; } .k2 { animation-delay: 1.3s; } .k3 { animation-delay: 2.4s; }
      .k4 { animation-delay: 3.2s; } .k5 { animation-delay: 4.1s; } .k6 { animation-delay: 5s; }
      .log { opacity: 0; animation: log 24s linear infinite; }
      .g1 { animation-delay: .5s; } .g2 { animation-delay: 3.7s; } .g3 { animation-delay: 6.9s; }
      .g4 { animation-delay: 10.1s; } .g5 { animation-delay: 13.3s; } .g6 { animation-delay: 16.5s; }
      @keyframes log { 0% { opacity: 0; transform: translateX(-5px); } 1.5% { opacity: 1; transform: none; } 90% { opacity: 1; } 96%,100% { opacity: 0; } }
      .scan { animation: scan 2s ease-in-out infinite alternate; }
      @keyframes scan { from { opacity: .4; } to { opacity: 1; } }
    </style>
  </defs>

  <rect width="880" height="420" fill="#0D1117" rx="14" stroke="#21262D" stroke-width="1.5"/>

  <!-- radar rings -->
  <circle cx="230" cy="210" r="170" fill="none" stroke="#21262D" stroke-width="1.2"/>
  <circle cx="230" cy="210" r="113" fill="none" stroke="#21262D" stroke-width="1"/>
  <circle cx="230" cy="210" r="56"  fill="none" stroke="#21262D" stroke-width="1"/>
  <path d="M 60 210 H 400 M 230 40 V 380" stroke="#161B22" stroke-width="1"/>
  <circle cx="230" cy="210" r="2.5" fill="#00D9FF"/>

  <!-- sweep -->
  <g class="sweep">
    <path d="M 230 210 L 230 40 A 170 170 0 0 1 315 62.7 Z" fill="url(#beam)"/>
    <path d="M 230 210 L 315 62.7" stroke="#00D9FF" stroke-width="1.4" stroke-opacity=".8"/>
  </g>

  <!-- contacts -->
  <circle class="ping k1" cx="170" cy="120" r="4" fill="none" stroke="#8A2BE2" stroke-width="1"/>
  <circle class="blip k1" cx="170" cy="120" r="3.5" fill="#8A2BE2"/>
  <circle class="ping k2" cx="308" cy="148" r="4" fill="none" stroke="#8A2BE2" stroke-width="1"/>
  <circle class="blip k2" cx="308" cy="148" r="3.5" fill="#8A2BE2"/>
  <circle class="ping k3" cx="330" cy="252" r="4" fill="none" stroke="#00D9FF" stroke-width="1"/>
  <circle class="blip k3" cx="330" cy="252" r="3.5" fill="#00D9FF"/>
  <circle class="ping k4" cx="262" cy="316" r="4" fill="none" stroke="#00D9FF" stroke-width="1"/>
  <circle class="blip k4" cx="262" cy="316" r="3.5" fill="#00D9FF"/>
  <circle class="ping k5" cx="148" cy="288" r="4" fill="none" stroke="#E6EDF3" stroke-width="1"/>
  <circle class="blip k5" cx="148" cy="288" r="3.5" fill="#E6EDF3"/>
  <circle class="ping k6" cx="210" cy="94"  r="4" fill="none" stroke="#E6EDF3" stroke-width="1"/>
  <circle class="blip k6" cx="210" cy="94"  r="3.5" fill="#E6EDF3"/>

  <text x="66" y="66" class="mono scan" font-size="10" letter-spacing="2" fill="#00D9FF">● SCANNING</text>
  <text x="66" y="372" class="mono" font-size="10" fill="#30363D">range: github.com/divcodes1121</text>

  <!-- contacts log -->
  <text x="440" y="66" class="mono" font-size="11" letter-spacing="3" fill="#7D8590">CONTACTS LOG</text>
  <path d="M 440 78 H 852" stroke="#21262D" stroke-width="1"/>

  <g class="mono" font-size="12.5">
    <g class="log g1">
      <circle cx="446" cy="104" r="3" fill="#8A2BE2"/>
      <text x="460" y="108" fill="#FFFFFF">automation_workflow</text>
      <text x="852" y="108" text-anchor="end" fill="#7D8590">ai · active</text>
    </g>
    <g class="log g2">
      <circle cx="446" cy="146" r="3" fill="#8A2BE2"/>
      <text x="460" y="150" fill="#FFFFFF">llm-ticket-triage</text>
      <text x="852" y="150" text-anchor="end" fill="#7D8590">ai · shipped</text>
    </g>
    <g class="log g3">
      <circle cx="446" cy="188" r="3" fill="#00D9FF"/>
      <text x="460" y="192" fill="#FFFFFF">eth-deposit-tracker</text>
      <text x="852" y="192" text-anchor="end" fill="#7D8590">infra · shipped</text>
    </g>
    <g class="log g4">
      <circle cx="446" cy="230" r="3" fill="#00D9FF"/>
      <text x="460" y="234" fill="#FFFFFF">metro-booking-system</text>
      <text x="852" y="234" text-anchor="end" fill="#7D8590">backend · shipped</text>
    </g>
    <g class="log g5">
      <circle cx="446" cy="272" r="3" fill="#E6EDF3"/>
      <text x="460" y="276" fill="#FFFFFF">property-rental-platform</text>
      <text x="852" y="276" text-anchor="end" fill="#7D8590">full-stack · shipped</text>
    </g>
    <g class="log g6">
      <circle cx="446" cy="314" r="3" fill="#E6EDF3"/>
      <text x="460" y="318" fill="#FFFFFF">leetcode-archive</text>
      <text x="852" y="318" text-anchor="end" fill="#7D8590">dsa · ongoing</text>
    </g>
  </g>

  <path d="M 440 344 H 852" stroke="#21262D" stroke-width="1"/>
  <text x="440" y="368" class="mono" font-size="10" fill="#30363D">6 contacts on scope · 24 more beyond range</text>
  <text x="852" y="368" text-anchor="end" class="mono" font-size="10" fill="#30363D">sweep: 6.0s</text>
</svg>

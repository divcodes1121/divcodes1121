<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 292" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>
    <style>
      .mono { font-family: Consolas, 'SF Mono', Menlo, monospace; }
      .sans { font-family: 'Segoe UI', system-ui, sans-serif; }
      .fill { transform-box: fill-box; transform-origin: left center; transform: scaleX(0);
              animation: fill 13s cubic-bezier(.3,0,.15,1) infinite; }
      @keyframes fill { 0% { transform: scaleX(0); } 10% { transform: scaleX(1); } 92% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
      .p1 { animation-delay: .15s; } .p2 { animation-delay: .35s; } .p3 { animation-delay: .55s; } .p4 { animation-delay: .75s; }
      .glowdot { animation: gd 2.2s ease-in-out infinite; }
      @keyframes gd { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect x="1" y="1" width="878" height="290" rx="14" fill="#0D1117" stroke="#21262D" stroke-width="1.5"/>
  <text x="28" y="40" class="mono" font-size="11" letter-spacing="4" fill="#7D8590">BUILD PIPELINE</text>
  <text x="852" y="40" text-anchor="end" class="mono glowdot" font-size="11" fill="#00D9FF">● RUNNING</text>
  <rect x="28" y="52" width="824" height="1" fill="#21262D"/>

  <!-- NOW -->
  <rect x="28" y="74" width="62" height="22" rx="11" fill="url(#accent)"/>
  <text x="59" y="89" text-anchor="middle" class="mono" font-size="10" font-weight="bold" fill="#0D1117">NOW</text>
  <text x="104" y="90" class="sans" font-size="14" fill="#E6EDF3">automation_workflow — automated video engine</text>
  <text x="852" y="90" text-anchor="end" class="mono" font-size="12" fill="#00D9FF">78%</text>
  <rect x="104" y="102" width="716" height="5" rx="2.5" fill="#21262D"/>
  <rect class="fill p1" x="104" y="102" width="558" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- NEXT -->
  <rect x="28" y="130" width="62" height="22" rx="11" fill="none" stroke="#00D9FF" stroke-width="1.2"/>
  <text x="59" y="145" text-anchor="middle" class="mono" font-size="10" fill="#00D9FF">NEXT</text>
  <text x="104" y="146" class="sans" font-size="14" fill="#E6EDF3">llm ticket system v2 — routing + evals</text>
  <text x="852" y="146" text-anchor="end" class="mono" font-size="12" fill="#00D9FF">35%</text>
  <rect x="104" y="158" width="716" height="5" rx="2.5" fill="#21262D"/>
  <rect class="fill p2" x="104" y="158" width="250" height="5" rx="2.5" fill="#00D9FF" opacity="0.85"/>

  <!-- RESEARCH -->
  <rect x="28" y="186" width="62" height="22" rx="11" fill="none" stroke="#8A2BE2" stroke-width="1.2"/>
  <text x="59" y="201" text-anchor="middle" class="mono" font-size="9" fill="#8A2BE2">STUDY</text>
  <text x="104" y="202" class="sans" font-size="14" fill="#E6EDF3">distributed inference patterns</text>
  <text x="852" y="202" text-anchor="end" class="mono" font-size="12" fill="#8A2BE2">12%</text>
  <rect x="104" y="214" width="716" height="5" rx="2.5" fill="#21262D"/>
  <rect class="fill p3" x="104" y="214" width="86" height="5" rx="2.5" fill="#8A2BE2" opacity="0.85"/>

  <!-- SHIPPED -->
  <rect x="28" y="242" width="62" height="22" rx="11" fill="none" stroke="#3FB950" stroke-width="1.2"/>
  <text x="59" y="257" text-anchor="middle" class="mono" font-size="9" fill="#3FB950">DONE</text>
  <text x="104" y="258" class="sans" font-size="14" fill="#E6EDF3">metro booking · rental platform · eth tracker</text>
  <text x="852" y="258" text-anchor="end" class="mono" font-size="12" fill="#3FB950">✓</text>
  <rect x="104" y="270" width="716" height="5" rx="2.5" fill="#21262D"/>
  <rect class="fill p4" x="104" y="270" width="716" height="5" rx="2.5" fill="#3FB950" opacity="0.55"/>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: Consolas, 'SF Mono', Menlo, monospace; font-size: 13px; }
      .cmd { opacity: 0; animation: show 24s linear infinite; }
      .out { opacity: 0; animation: show 24s linear infinite; }
      .c1 { animation-delay: .4s; }  .o1 { animation-delay: 1.5s; }
      .c2 { animation-delay: 2.8s; } .o2 { animation-delay: 3.9s; }
      .c3 { animation-delay: 5.2s; } .o3 { animation-delay: 6.3s; }
      .c4 { animation-delay: 7.6s; } .o4 { animation-delay: 8.7s; }
      .c5 { animation-delay: 10s; }
      @keyframes show {
        0% { opacity: 0; transform: translateY(3px); }
        1.2% { opacity: 1; transform: translateY(0); }
        91% { opacity: 1; }
        96%, 100% { opacity: 0; }
      }
      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect x="1" y="1" width="878" height="358" rx="14" fill="#0D1117" stroke="#21262D" stroke-width="1.5"/>

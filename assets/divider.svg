<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#21262D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#30363D"/>
      <stop offset="1" stop-color="#21262D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A2BE2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#8A2BE2" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sweep { animation: slide 3.6s cubic-bezier(.4,0,.2,1) infinite; }
      @keyframes slide {
        0%   { transform: translateX(-260px); opacity: 0; }
        12%  { opacity: 1; }
        88%  { opacity: 1; }
        100% { transform: translateX(940px); opacity: 0; }
      }
    </style>
  </defs>
  <rect x="0" y="11" width="880" height="1.5" fill="url(#base)"/>
  <rect class="sweep" x="0" y="10.5" width="200" height="2.5" rx="1.25" fill="url(#sweep)"/>
</svg>

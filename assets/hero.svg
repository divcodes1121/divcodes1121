<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>
    <radialGradient id="orbP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8A2BE2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8A2BE2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363D" opacity="0.5"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; }
      .mono { font-family: Consolas, 'SF Mono', Menlo, monospace; }
      .orb1 { animation: drift1 16s ease-in-out infinite alternate; }
      .orb2 { animation: drift2 21s ease-in-out infinite alternate; }
      @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(46px,26px); } }
      @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-52px,-20px); } }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
      @keyframes pulse { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(3.4); opacity: 0; } }
      .role { opacity: 0; animation: role 12s infinite; }
      .r2 { animation-delay: 3s; } .r3 { animation-delay: 6s; } .r4 { animation-delay: 9s; }
      @keyframes role {
        0% { opacity: 0; transform: translateY(6px); }
        4%, 22% { opacity: 1; transform: translateY(0); }
        27%, 100% { opacity: 0; transform: translateY(-6px); }
      }
      .cue { animation: cue 2.2s ease-in-out infinite; }
      @keyframes cue { 0%,100% { transform: translateY(0); opacity:.55; } 50% { transform: translateY(5px); opacity:1; } }
      .in { opacity: 0; animation: fadein 0.9s ease-out forwards; }
      .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .6s; } .d4 { animation-delay: .85s; }
      @keyframes fadein { to { opacity: 1; } }
    </style>
  </defs>

  <rect width="880" height="420" fill="#0D1117"/>
  <rect width="880" height="420" fill="url(#grid)"/>
  <circle class="orb1" cx="150" cy="80" r="190" fill="url(#orbP)"/>
  <circle class="orb2" cx="740" cy="360" r="220" fill="url(#orbB)"/>

  <rect x="0" y="0" width="880" height="1.5" fill="url(#accent)" opacity="0.55"/>

  <g class="in">
    <circle cx="46" cy="42" r="4" fill="#3FB950"/>
    <circle class="pulse" cx="46" cy="42" r="4" fill="none" stroke="#3FB950" stroke-width="1"/>
    <text x="62" y="46" class="mono" font-size="11" letter-spacing="3" fill="#7D8590">SYSTEM ONLINE</text>
    <text x="834" y="46" text-anchor="end" class="mono" font-size="11" letter-spacing="3" fill="#7D8590">EST. 2023 · LUCKNOW, IN</text>
  </g>

  <text x="440" y="188" text-anchor="middle" class="sans in d1" font-size="74" font-weight="800" letter-spacing="4" fill="#E6EDF3">DIVYANSHU</text>
  <text x="440" y="252" text-anchor="middle" class="sans in d2" font-size="74" font-weight="800" letter-spacing="26" fill="url(#accent)">SINGH</text>

  <g class="in d3">
    <text x="440" y="304" text-anchor="middle" class="mono role" font-size="14" letter-spacing="7" fill="#00D9FF">AI  ENGINEER</text>
    <text x="440" y="304" text-anchor="middle" class="mono role r2" font-size="14" letter-spacing="7" fill="#00D9FF">BACKEND  ARCHITECT</text>
    <text x="440" y="304" text-anchor="middle" class="mono role r3" font-size="14" letter-spacing="7" fill="#00D9FF">ML  PRACTITIONER</text>
    <text x="440" y="304" text-anchor="middle" class="mono role r4" font-size="14" letter-spacing="7" fill="#00D9FF">SYSTEM  DESIGNER</text>
  </g>

  <text x="440" y="345" text-anchor="middle" class="sans in d4" font-size="15" fill="#7D8590">I build intelligent systems that survive contact with production.</text>

  <g class="cue">
    <text x="440" y="398" text-anchor="middle" class="mono" font-size="10" letter-spacing="4" fill="#7D8590">SCROLL</text>
    <path d="M 434 404 L 440 410 L 446 404" fill="none" stroke="#7D8590" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <rect x="0" y="418.5" width="880" height="1.5" fill="url(#accent)" opacity="0.3"/>
</svg>

name: Domain Topology — 3D Contribution Skyline

on:
  schedule:
    # Runs daily at 18:30 UTC (00:00 IST)
    - cron: "30 18 * * *"
  workflow_dispatch:
  # Fires once when this workflow file itself is committed, so the first
  # skyline generates immediately instead of waiting for the schedule.
  push:
    paths:
      - ".github/workflows/3d-contrib.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution skyline
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --staged --quiet || git commit -m "chore: regenerate 3D contribution skyline"
          git push

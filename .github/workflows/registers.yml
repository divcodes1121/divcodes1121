name: Generate Live Registers

on:
  schedule:
    # daily at 18:45 UTC (00:15 IST)
    - cron: "45 18 * * *"
  workflow_dispatch:
  # regenerate immediately when the generator itself changes
  push:
    paths:
      - ".github/workflows/registers.yml"
      - "scripts/generate-registers.mjs"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render station + cargo panels from live data
        run: node scripts/generate-registers.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated panels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/generated
          git diff --staged --quiet || git commit -m "chore: refresh live registers"
          git push
